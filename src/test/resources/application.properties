
# Isolated H2 in-memory database for tests
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:quantity_test;DB_CLOSE_DELAY=-1
db.username=sa
db.password=

# Connection pool configuration
db.pool.maximum-pool-size=5
db.pool.minimum-idle=1
db.pool.connection-timeout=30000
db.pool.idle-timeout=600000
db.pool.max-lifetime=1800000

app.repository.type=database
